# ABOUTME: Installs the embacle FFI from the dravr-ai tap for jobs that build with it.
# ABOUTME: One definition for every workflow, so the install cannot drift between them.
name: Setup embacle FFI
description: >
  Install the latest embacle-ffi from dravr-ai/tap and expose libembacle.a where
  the Package.swift search paths look for it. Reports the installed version so a
  build always states which FFI it linked.

runs:
  using: composite
  steps:
    - name: Install embacle FFI
      shell: bash
      run: |
        set -euo pipefail
        brew tap dravr-ai/tap
        # Recent Homebrew refuses to load a formula from an untrusted tap.
        brew trust --tap dravr-ai/tap
        # The tap is freshly cloned per run, but update makes "latest" explicit
        # rather than a side effect of that.
        brew update --quiet
        # The macos-15 runner image pre-links openssl@1.1, so embacle-ffi's
        # openssl@3 dependency fails to `brew link` (/opt/homebrew/bin/openssl is
        # owned by 1.1) and the install exits non-zero under `set -e`, even though
        # every keg (embacle-ffi included) pours fine. Recover with brew's own
        # suggested remedy — force-link openssl@3 over the stale 1.1 symlinks —
        # then assert embacle-ffi really installed so a genuine failure still fails.
        brew install embacle-ffi || brew link --overwrite --force openssl@3
        brew list --versions embacle-ffi >/dev/null
        sudo mkdir -p /usr/local/lib
        sudo ln -sf "$(brew --prefix embacle-ffi)/lib/libembacle.a" /usr/local/lib/

    - name: Require the tap's latest embacle
      shell: bash
      run: |
        set -euo pipefail
        INSTALLED=$(brew list --versions embacle-ffi | awk '{print $2}')
        LATEST=$(brew info --json=v2 embacle-ffi | python3 -c "
        import json, sys
        print(json.load(sys.stdin)['formulae'][0]['versions']['stable'])
        ")
        echo "embacle-ffi installed: $INSTALLED (tap latest: $LATEST)"
        # A fresh runner that just tapped and installed should always land on
        # the tap's latest. Anything else means the install silently resolved
        # to an older build, and every artifact from this run would embed it —
        # a stale FFI is invisible once linked, so this fails rather than warns.
        if [ "$INSTALLED" != "$LATEST" ]; then
          echo "::error::embacle-ffi resolved to $INSTALLED, not the tap's latest ($LATEST)"
          exit 1
        fi
